{%- comment -%}
  "Talks & Posters" grid; groups come from _data/gallery.yml.
  Each group spans as many grid columns as it has photos, with one caption underneath.
  Clicking a photo opens the full-size image or the poster PDF.
{%- endcomment -%}
<div class="gallery">
{%- for g in site.data.gallery %}
<figure class="gallery__group" style="--n: {{ g.photos.size }}">
<div class="gallery__photos">
{%- for p in g.photos %}
<a href="{{ p.link | relative_url }}" title="{{ g.event }} · {{ g.label }}"><img src="{{ p.thumb | relative_url }}" alt="{{ g.event }}: {{ g.label }}" loading="lazy"></a>
{%- endfor %}
</div>
<figcaption class="gallery__cap"><strong>{{ g.event }}</strong> &middot; {{ g.label }}</figcaption>
</figure>
{%- endfor %}
</div>
